<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sales Intel</title>
<style>
  :root { --ink:#1a2333; --muted:#5f6b7c; --accent:#e4572e; --line:#e3e8ef; }
  * { box-sizing: border-box; }
  body { font-family: system-ui, -apple-system, Segoe UI, sans-serif;
         margin:0; background:#fff; color:var(--ink); }
  header { padding:28px 24px 20px; border-bottom:1px solid var(--line); }
  h1 { margin:0; font-size:22px; }
  header p { margin:6px 0 0; color:var(--muted); font-size:14px; }
  main { max-width:820px; margin:0 auto; padding:24px; }
  textarea { width:100%; min-height:110px; padding:12px; font:inherit;
             border:1px solid var(--line); border-radius:8px; resize:vertical; }
  .row { display:flex; gap:12px; align-items:center; margin-top:12px; }
  button { background:var(--accent); color:#fff; border:0; padding:11px 20px;
           border-radius:8px; font:inherit; font-weight:600; cursor:pointer; }
  button:disabled { opacity:.5; cursor:default; }
  label { font-size:14px; color:var(--muted); }
  .card { border:1px solid var(--line); border-radius:10px; padding:18px;
          margin-top:16px; }
  .card h2 { margin:0 0 4px; font-size:18px; }
  .meta { font-size:12px; color:var(--muted); margin-bottom:10px; }
  .tag { display:inline-block; background:#f4f6f9; border-radius:20px;
         padding:2px 10px; font-size:12px; margin-right:6px; }
  .tag-aviso { background:#fde8e0; color:var(--accent); font-weight:600; }
  .bloco { margin-top:12px; }
  .bloco strong { display:block; font-size:13px; color:var(--muted);
                  text-transform:uppercase; letter-spacing:.5px; margin-bottom:4px; }
  ul { margin:4px 0; padding-left:18px; }
  .vazio { color:var(--muted); font-style:italic; }
  input[type="text"], input[type="password"], select { width:100%; padding:10px; font:inherit;
             border:1px solid var(--line); border-radius:8px; margin-top:4px; }
</style>
</head>
<body>
<header>
  <h1>Sales Intel</h1>
  <p>Cole os links do cliente e receba um briefing pronto para a reunião.</p>
  <div id="cabecalho-usuario" class="row" hidden>
    <span id="nome-usuario-logado" class="meta"></span>
    <button id="btn-sair">Sair</button>
  </div>
</header>

<main id="login" hidden>
  <div class="card">
    <h2>Entrar</h2>
    <label for="login-usuario">Usuário</label>
    <input type="text" id="login-usuario" placeholder="usuario" autocomplete="username">
    <label for="login-senha">Senha</label>
    <input type="password" id="login-senha" placeholder="senha" autocomplete="current-password">
    <div class="row">
      <button id="btn-entrar">Entrar</button>
      <span id="login-status" class="meta"></span>
    </div>
  </div>
</main>

<main id="app" hidden>
  <textarea id="urls" placeholder="Um link por linha&#10;https://exemplo.com.br&#10;https://exemplo.com.br/sobre"></textarea>
  <div class="row">
    <button id="btn">Gerar briefing</button>
    <label><input type="checkbox" id="forcar"> Ignorar cache</label>
    <span id="status" class="meta"></span>
  </div>
  <div id="resultados"></div>

  <div class="card" id="painel-historico">
    <h2>Histórico</h2>
    <div class="row">
      <button id="btn-historico">Atualizar histórico</button>
      <span id="historico-status" class="meta"></span>
    </div>
    <div id="historico-lista"></div>
  </div>

  <div class="card" id="admin" hidden>
    <!-- L-07: esconder esta secao para quem nao e admin e conforto de uso,
         nao controle de acesso — o servidor recusa o vendedor com 403 nas
         tres rotas abaixo mesmo que a secao seja forcada a aparecer pelo
         inspetor (teste de fechamento em test_smoke.py, SPEC §15). -->
    <h2>Administração</h2>
    <div class="row">
      <button id="btn-usuarios">Atualizar lista</button>
      <span id="admin-status" class="meta"></span>
    </div>
    <div id="lista-usuarios"></div>

    <h2>Novo usuário</h2>
    <label for="novo-usuario-username">Usuário</label>
    <input type="text" id="novo-usuario-username" placeholder="usuario" autocomplete="off">
    <label for="novo-usuario-senha">Senha</label>
    <input type="password" id="novo-usuario-senha" placeholder="senha" autocomplete="new-password">
    <label for="novo-usuario-papel">Papel</label>
    <select id="novo-usuario-papel">
      <option value="vendedor">vendedor</option>
      <option value="admin">admin</option>
    </select>
    <div class="row">
      <button id="btn-criar-usuario">Criar usuário</button>
      <span id="criar-usuario-status" class="meta"></span>
    </div>
  </div>
</main>

<script>
// L-07: o que este script mostra ou esconde na tela e conforto de uso,
// nunca controle de acesso. A autorizacao de verdade roda no servidor a
// cada requisicao e continua recusando o vendedor mesmo com a tela
// forcada a aparecer pelo inspetor.

const btn = document.getElementById('btn');
const status = document.getElementById('status');
const saida = document.getElementById('resultados');

const secaoLogin = document.getElementById('login');
const secaoApp = document.getElementById('app');
const cabecalhoUsuario = document.getElementById('cabecalho-usuario');
const nomeUsuarioLogado = document.getElementById('nome-usuario-logado');
const campoLoginUsuario = document.getElementById('login-usuario');
const campoLoginSenha = document.getElementById('login-senha');
const btnEntrar = document.getElementById('btn-entrar');
const btnSair = document.getElementById('btn-sair');
const loginStatus = document.getElementById('login-status');

const btnHistorico = document.getElementById('btn-historico');
const historicoStatus = document.getElementById('historico-status');
const historicoLista = document.getElementById('historico-lista');

const admin = document.getElementById('admin');
const btnUsuarios = document.getElementById('btn-usuarios');
const adminStatus = document.getElementById('admin-status');
const listaUsuarios = document.getElementById('lista-usuarios');
const btnCriarUsuario = document.getElementById('btn-criar-usuario');
const criarUsuarioStatus = document.getElementById('criar-usuario-status');

let usuarioLogado = null;

async function carregarUsuarios() {
  btnUsuarios.disabled = true;
  adminStatus.textContent = 'Carregando...';
  try {
    const resp = await fetch('/api/admin/usuarios');
    if (!resp.ok) throw new Error('Erro ' + resp.status);
    const usuarios = await resp.json();
    adminStatus.textContent = usuarios.length + ' usuario(s)';
    listaUsuarios.innerHTML = usuarios.map(renderUsuario).join('');
  } catch (e) {
    adminStatus.textContent = 'Falhou: ' + escapar(e.message);
  } finally {
    btnUsuarios.disabled = false;
  }
}

function renderUsuario(u) {
  return `<div class="row">
    <span>${escapar(u.username)}</span>
    <span class="tag">${escapar(u.papel)}</span>
    <span class="tag">${u.ativo ? 'ativo' : 'inativo'}</span>
    <button class="btn-alternar-ativo" data-id="${escapar(u.id)}" data-ativo="${u.ativo}">${u.ativo ? 'Desativar' : 'Ativar'}</button>
  </div>`;
}

btnUsuarios.onclick = carregarUsuarios;

// Clique tratado por delegacao a partir do contenedor: nenhum manipulador
// de evento embutido na marcacao (T-06-48).
listaUsuarios.addEventListener('click', async (ev) => {
  const alvo = ev.target.closest('.btn-alternar-ativo');
  if (!alvo) return;
  const id = alvo.dataset.id;
  const ativoAtual = alvo.dataset.ativo === 'true';

  alvo.disabled = true;
  try {
    const resp = await fetch('/api/admin/usuarios/' + encodeURIComponent(id) + '/ativo', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ ativo: !ativoAtual })
    });
    if (!resp.ok) {
      const corpo = await resp.json().catch(() => ({}));
      adminStatus.textContent = escapar(corpo.detail || ('Erro ' + resp.status));
      return;
    }
    await carregarUsuarios();
  } catch (e) {
    adminStatus.textContent = 'Falhou: ' + escapar(e.message);
  } finally {
    alvo.disabled = false;
  }
});

btnCriarUsuario.onclick = async () => {
  const username = document.getElementById('novo-usuario-username').value.trim();
  const senha = document.getElementById('novo-usuario-senha').value;
  const papel = document.getElementById('novo-usuario-papel').value;

  btnCriarUsuario.disabled = true;
  criarUsuarioStatus.textContent = 'Criando...';
  try {
    const resp = await fetch('/api/admin/usuarios', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ username, senha, papel })
    });
    if (resp.status === 422) {
      criarUsuarioStatus.textContent = 'Usuario (min. 3) e senha (min. 12) nao atendem os requisitos.';
      return;
    }
    if (!resp.ok) {
      const corpo = await resp.json().catch(() => ({}));
      criarUsuarioStatus.textContent = escapar(corpo.detail || ('Erro ' + resp.status));
      return;
    }
    document.getElementById('novo-usuario-username').value = '';
    document.getElementById('novo-usuario-senha').value = '';
    criarUsuarioStatus.textContent = '';
    await carregarUsuarios();
  } catch (e) {
    criarUsuarioStatus.textContent = 'Falhou: ' + escapar(e.message);
  } finally {
    btnCriarUsuario.disabled = false;
  }
};

async function carregarHistorico() {
  btnHistorico.disabled = true;
  historicoStatus.textContent = 'Carregando...';
  try {
    const resp = await fetch('/api/historico?limite=50');
    if (resp.status === 401) {
      await carregarSessao();
      return;
    }
    if (!resp.ok) throw new Error('Erro ' + resp.status);
    const linhas = await resp.json();
    historicoStatus.textContent = linhas.length + ' registro(s)';
    historicoLista.innerHTML = linhas.length
      ? linhas.map(renderHistorico).join('')
      : '<p class="vazio">Nenhum registro ainda.</p>';
  } catch (e) {
    historicoStatus.textContent = 'Falhou: ' + escapar(e.message);
  } finally {
    btnHistorico.disabled = false;
  }
}

function renderHistorico(linha) {
  const colunaDono = usuarioLogado && usuarioLogado.papel === 'admin'
    ? `<span class="tag">dono: ${escapar(linha.dono ?? 'origem desconhecida')}</span>`
    : '';
  return `<div class="card">
    <div class="meta">${escapar(linha.url)}</div>
    <span class="tag">extrator: ${escapar(linha.extrator)}</span>
    <span class="tag">coletado em: ${escapar(linha.coletado_em)}</span>
    ${colunaDono}
  </div>`;
}

btnHistorico.onclick = carregarHistorico;

async function carregarSessao() {
  try {
    const resp = await fetch('/api/auth/me');
    if (resp.status === 200) {
      usuarioLogado = await resp.json();
      secaoLogin.hidden = true;
      secaoApp.hidden = false;
      cabecalhoUsuario.hidden = false;
      nomeUsuarioLogado.textContent = escapar(usuarioLogado.username);
      // L-07: exibir a secao de admin aqui e conveniencia — o servidor
      // continua sendo quem decide (exigir_admin nas tres rotas).
      admin.hidden = usuarioLogado.papel !== 'admin';
      if (usuarioLogado.papel === 'admin') {
        await carregarUsuarios();
      }
      await carregarHistorico();
    } else if (resp.status === 401) {
      usuarioLogado = null;
      secaoApp.hidden = true;
      cabecalhoUsuario.hidden = true;
      secaoLogin.hidden = false;
      admin.hidden = true;
    } else {
      loginStatus.textContent = 'Nao foi possivel verificar a sessao (' + resp.status + ').';
    }
  } catch (e) {
    loginStatus.textContent = 'Falha ao verificar sessao: ' + escapar(e.message);
  }
}

btnEntrar.onclick = async () => {
  const usuario = campoLoginUsuario.value.trim();
  const senha = campoLoginSenha.value;
  if (!usuario || !senha) { loginStatus.textContent = 'Preencha usuario e senha.'; return; }

  btnEntrar.disabled = true;
  loginStatus.textContent = 'Entrando...';

  try {
    const resp = await fetch('/api/auth/login', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ username: usuario, senha })
    });
    if (!resp.ok) {
      const corpo = await resp.json().catch(() => ({}));
      loginStatus.textContent = escapar(corpo.detail || ('Erro ' + resp.status));
      return;
    }
    campoLoginSenha.value = '';
    loginStatus.textContent = '';
    await carregarSessao();
  } catch (e) {
    loginStatus.textContent = 'Falhou: ' + escapar(e.message);
  } finally {
    btnEntrar.disabled = false;
  }
};

btnSair.onclick = async () => {
  btnSair.disabled = true;
  try {
    await fetch('/api/auth/logout', { method: 'POST' });
  } finally {
    btnSair.disabled = false;
    await carregarSessao();
  }
};

btn.onclick = async () => {
  const urls = document.getElementById('urls').value
    .split('\n').map(s => s.trim()).filter(Boolean);
  if (!urls.length) { status.textContent = 'Cole pelo menos um link.'; return; }

  btn.disabled = true;
  status.textContent = 'Coletando...';
  saida.innerHTML = '';

  try {
    const resp = await fetch('/api/briefings', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ urls, forcar_atualizacao: document.getElementById('forcar').checked })
    });
    if (!resp.ok) throw new Error('Erro ' + resp.status);
    const dados = await resp.json();
    status.textContent = dados.length + ' resultado(s)';
    saida.innerHTML = dados.map(render).join('');
    await carregarHistorico();
  } catch (e) {
    status.textContent = 'Falhou: ' + e.message;
  } finally {
    btn.disabled = false;
  }
};

function lista(titulo, itens) {
  if (!itens || !itens.length) return '';
  return `<div class="bloco"><strong>${titulo}</strong>
    <ul>${itens.map(i => `<li>${escapar(i)}</li>`).join('')}</ul></div>`;
}

function render(r) {
  const b = r.briefing;
  return `<div class="card">
    <h2>${escapar(b.empresa)}</h2>
    <div class="meta">
      <span class="tag">${r.origem === 'cache' ? 'do cache' : 'coletado agora'}</span>
      <span class="tag">extrator: ${escapar(r.extrator)}</span>
      <span class="tag">confiança: ${escapar(b.confianca)}</span>
      ${r.degradado ? `<span class="tag tag-aviso">${escapar(r.degradado)}</span>` : ''}
      ${escapar(r.url)}
    </div>
    <p>${escapar(b.resumo) || '<span class="vazio">sem resumo</span>'}</p>
    ${lista('Produtos', b.produtos)}
    ${lista('Sinais recentes', b.sinais_recentes)}
    ${lista('Dores prováveis', b.dores_provaveis)}
    ${lista('Ganchos de conversa', b.ganchos_de_conversa)}
    ${lista('Contatos', b.contatos)}
  </div>`;
}

// T-06-46: a aspa simples entra na classe de escape porque a area de
// administracao passa a interpolar o id do usuario dentro de um atributo
// de dado — sem esse caractere, o escape seria incompleto em contexto de
// atributo.
function escapar(s) {
  return String(s ?? '').replace(/[&<>"']/g, c =>
    ({ '&':'&amp;', '<':'&lt;', '>':'&gt;', '"':'&quot;', "'":'&#39;' }[c]));
}

carregarSessao();
</script>
</body>
</html>
